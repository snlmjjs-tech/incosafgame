<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>INCOSAFIN aprende inglés en el colegio · v2</title>
<style>
:root{--navy:#14204f;--gold:#f7c600;--ink:#0a1230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 25%,#1d2f75 0,#0a1230 72%);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}
canvas{display:block;border:4px solid var(--gold);border-radius:14px;box-shadow:0 0 0 4px var(--navy),0 14px 44px rgba(0,0,0,.65);background:#000}
#pad{display:none;width:100%;max-width:640px;padding:0 14px;justify-content:space-between;align-items:center}
body.touch #pad{display:flex}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.btn{border:3px solid var(--gold);background:rgba(20,32,79,.92);color:var(--gold);border-radius:14px;font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;touch-action:none}
.btn:active,.btn.on{background:var(--gold);color:var(--navy)}
#acts{display:flex;gap:14px;align-items:center}
#bA{width:84px;height:84px;border-radius:50%;font-size:17px}
#bL{width:56px;height:56px;border-radius:50%;font-size:22px}
#nm,#cd{display:none;position:absolute;z-index:5;box-sizing:border-box;border:4px solid var(--gold);border-radius:14px;background:#0d163c;color:#fff;
  font:700 24px "Trebuchet MS","Segoe UI",system-ui,sans-serif;text-align:center;outline:none;user-select:text;-webkit-user-select:text;touch-action:auto;padding:0 10px}
#nm::placeholder,#cd::placeholder{color:#8e9bd0;font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Juego: INCOSAFIN aprende inglés en el colegio"></canvas>
  <input id="cd" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Código" aria-label="Ingresar código">
  <input id="nm" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Tu nombre / Your name" aria-label="Escribe tu nombre">
  <div id="pad">
    <div id="dpad">
      <div></div><div class="btn" data-dir="up">▲</div><div></div>
      <div class="btn" data-dir="left">◀</div><div></div><div class="btn" data-dir="right">▶</div>
      <div></div><div class="btn" data-dir="down">▼</div><div></div>
    </div>
    <div id="acts"><div class="btn" id="bL">🔊</div><div class="btn" id="bA">Hablar</div></div>
  </div>
</div>

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function mvWindow(c,x,y,w,h,r,opts={}){
  const {tone='navy',selected=false,shadow=true,gems=true}=opts;
  c.save();
  if(shadow){c.fillStyle='rgba(0,0,0,.35)';rr(c,x+2,y+4,w,h,r);c.fill();}
  const g=c.createLinearGradient(0,y,0,y+h);
  if(selected){g.addColorStop(0,'#ffe27a');g.addColorStop(1,GOLD);}
  else if(tone==='danger'){g.addColorStop(0,'#4a1420');g.addColorStop(1,'#2a0a12');}
  else{g.addColorStop(0,'#1c2a66');g.addColorStop(.55,'#101a48');g.addColorStop(1,'#0a1230');}
  c.fillStyle=g;rr(c,x,y,w,h,r);c.fill();
  if(!selected){c.fillStyle='rgba(255,255,255,.05)';rr(c,x,y,w,h*.45,r);c.fill();}
  c.strokeStyle=selected?NAVY:GOLD;c.lineWidth=selected?2.4:2.6;rr(c,x,y,w,h,r);c.stroke();
  c.strokeStyle=selected?'rgba(20,32,79,.5)':'rgba(255,255,255,.28)';c.lineWidth=1;rr(c,x+3.2,y+3.2,w-6.4,h-6.4,Math.max(2,r-3));c.stroke();
  if(gems&&w>50&&h>26){
    c.fillStyle=selected?NAVY:GOLD;
    for(const [gx,gy] of [[x+7,y+7],[x+w-7,y+7],[x+7,y+h-7],[x+w-7,y+h-7]]){
      c.beginPath();c.moveTo(gx,gy-3);c.lineTo(gx+3,gy);c.lineTo(gx,gy+3);c.lineTo(gx-3,gy);c.closePath();c.fill();
    }
  }
  c.restore();
}
function hash(x,y,s=0){let n=Math.imul(x+101,374761393)+Math.imul(y+57,668265263)+Math.imul(s+13,1274126177);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wrap(c,text,maxW){const words=String(text).split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function typed(c,lines,n,x,y,lh){let left=n;for(const ln of lines){const ch=Array.from(ln);const take=Math.max(0,Math.min(ch.length,left));if(take>0)c.fillText(ch.slice(0,take).join(''),x,y);left-=ch.length+1;y+=lh;if(left<=0)break;}}
function starPath(c,cx,cy,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;c[i?'lineTo':'moveTo'](cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}c.closePath();}

function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
  try{ac=new A();master=ac.createGain();master.gain.value=state.vol;master.connect(ac.destination);setInterval(musicTick,110);}catch(e){ac=null;}
}
function note(f,d,type='square',v=.06,when=0){
  if(!ac||!f)return;
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}

function musicTick(){
  if(!ac||ac.state!=='running'||!state.music)return;
  if(mNext<ac.currentTime)mNext=ac.currentTime+.05;
  while(mNext<ac.currentTime+.4){
    const d=mNext-ac.currentTime;
    const th=THEMES[(cur&&cur.theme)||1];
    const m=th.mel[mStep%32]; if(m)note(m,.17,th.wave,.05,d);
    if(mStep%2===0)note(th.bas[(mStep/2)%16],.34,'square',.02,d);
    mStep++;mNext+=th.step;
  }
}
function speak(t){
  if(!state.voice||!('speechSynthesis' in window))return;
  const s=String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/_+/g,', blank, ').replace(/[^\x20-\x7E]/g,' ').replace(/\s+/g,' ').trim(); if(!s)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;u.pitch=1.05;
    const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

   case 'F':paving(c,x,y,px,py);break;
   case 'G':grass(c,x,y,px,py);break;

   case '#':case 'W':wallTile(c,m,x,y,px,py,ch);break;

   case 'T':drawFloor(c,m,x,y,px,py);tableTile(c,m,x,y,px,py);break;
   case 'C':drawFloor(c,m,x,y,px,py);counterTile(c,x,y,px,py);break;
   case 'P':drawFloor(c,m,x,y,px,py);plantTile(c,px,py);break;
   case 'K':treeTile(c,x,y,px,py);break;
   case 'H':hedgeTile(c,x,y,px,py);break;
   case 'O':(m.floor==='cobble'?cobbleFloor:paving)(c,x,y,px,py);break;

  for(const d of m.doors){

    c.fillStyle=GOLD;rr(c,d.x*TS+16-w/2,TS+9,w,20,6);c.fill();c.strokeStyle=NAVY;c.lineWidth=2;c.stroke();

async function runQuiz(n,quiz){
  for(let i=0;i<quiz.qs.length;i++){
    const q=quiz.qs[i];
    const opts=shuffle(q.opts.map((t,k)=>({t:fmt(t),ok:k===0})));
    const qen=fmt(q.en);
    const ch={spk:n,en:qen,es:fmt(q.es||''),pic:q.pic,tag:`${quiz.tag} ${i+1}/${quiz.qs.length}`,t:0,len:Array.from(qen).length,opts,sel:0,disabled:new Set(),msg:'',shake:0};
    speak(qen);
    let right=null;
    while(right===null){
      const idx=await askChoice(ch);
      if(opts[idx].ok){right=idx;}
      else{
        ch.disabled.add(idx);ch.msg=q.hint;ch.shake=.35;save.mistakes++;sfx.bad();speak('Try again!');
        ch.sel=opts.findIndex((o,k)=>!ch.disabled.has(k));
      }
    }
    sfx.ok();
    const pr=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    const ans=opts[right].t.replace(/\s*[^\x20-\x7E]+\s*$/,'');
    await say(n,`Yes! "${ans}". ${pr[0]}`,pr[1]);
  }
}

async function runBossQuiz(n,quiz){

    const ch={spk:n,en:qen,es:fmt(q.es||''),pic:q.pic,tag:'Test '+(i+1)+'/'+quiz.qs.length+'  '+'♥'.repeat(lives)+'♡'.repeat(3-lives),t:0,len:Array.from(qen).length,opts,sel:0,disabled:new Set(),msg:'',shake:0};

    else{

function onArrive(){
  sfx.step();
  const d=cur.doors.find(d=>d.x===player.x&&d.y===player.y);
  if(!d)return;
  runScript(async()=>{
    if(d.req&&!d.req()&&!state.cheat){
      sfx.bad();
      const m=d.msg();await say(PLAYER,m[0],m[1]);
      const b=d.back||[0,1];
      player.x=player.tx=d.x+b[0];player.y=player.ty=d.y+b[1];player.px=player.x*TS;player.py=player.y*TS;
      player.dir=b[0]<0?'left':b[0]>0?'right':'down';resetTrail();
      return;
    }
    await goMap(d.to,d.tx,d.ty,d.dir);
  });
}
function tryMove(dir){
  player.dir=dir;const [dx,dy]=DIRS[dir];const nx=player.x+dx,ny=player.y+dy;
  if(passable(nx,ny)){player.moving=true;player.tx=nx;player.ty=ny;}
}
function stepPlayer(dt){
  if(scene!=='game')return;
  let budget=150*dt;
  const canMove=()=>!ui.locked&&ui.mode==='play'&&ui.fade<.6;
  while(player.moving&&budget>0){
    player.anim+=dt*13;
    const gx=player.tx*TS,gy=player.ty*TS,dx=gx-player.px,dy=gy-player.py,dist=Math.hypot(dx,dy);
    if(dist<=budget){
      player.px=gx;player.py=gy;player.x=player.tx;player.y=player.ty;player.moving=false;budget-=dist;
      onArrive();
      const d=held[held.length-1];if(d&&canMove())tryMove(d);
    }else{player.px+=dx/dist*budget;player.py+=dy/dist*budget;budget=0;}
  }
  if(!player.moving){player.anim=0;const d=held[held.length-1];if(d&&canMove())tryMove(d);}
  pushTrail();
}
function facingTarget(){
  const [dx,dy]=DIRS[player.dir],x=player.x+dx,y=player.y+dy;
  const n=npcAt(x,y);if(n)return{npc:n,x,y};
  const ch=tileAt(cur,x,y);if((cur.tileTalk&&cur.tileTalk[ch])||TILE_TALK[ch])return{tile:ch,x,y};
  return null;
}
function interact(){
  const t=facingTarget();if(!t)return;
  if(t.npc)runScript(()=>talkNPC(t.npc));
  else runScript(()=>tileTalk(t.tile,t.x,t.y));
}

  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  const d=ui.mode==='say'?ui.dlg:ui.mode==='choose'?ui.choice:null;
  if(d){if(d.t<d.len)d.t=Math.min(d.len,d.t+dt*46);if(d.shake>0)d.shake=Math.max(0,d.shake-dt);}
  if(ui.fadeTarget!==null){
    const dir=Math.sign(ui.fadeTarget-ui.fade);ui.fade+=dir*dt*5;
    if((dir>0&&ui.fade>=ui.fadeTarget)||(dir<=0&&ui.fade<=ui.fadeTarget)){ui.fade=ui.fadeTarget;ui.fadeTarget=null;const r=ui.fadeRes;ui.fadeRes=null;r&&r();}
  }
  if(ui.banner){ui.banner.t-=dt;if(ui.banner.t<=0)ui.banner=null;}
  if(ui.photo)ui.photo.t+=dt;if(ui.death)ui.death.t+=dt;if(ui.shake>0)ui.shake=Math.max(0,ui.shake-dt);
  if(scene==='game'){stepPlayer(dt);updateParts(dt);}
  if(scene==='end'){endT+=dt;confetti();updateParts(dt);}
  render();
  requestAnimationFrame(frame);
}

/* ---------- inicio / menús ---------- */
function startGame(cont){
  initAudio();
  if(!cont){beginSetup();return;}
  const s=loadSave();save=s||newSave();
  if(!save.name){beginSetup();return;}
  enterWorld();
}

}

function defaultLook(g){return g==='f'
  ?{g:'f',hs:'ponytail',hair:'#6b4226',eyes:'#3b2a1c',skin:'#f2c9a0',build:1,shirt:'#ff8fb1',bt:'skirt',pants:'#1c2a5e',shoes:'#ffffff'}
  :{g:'m',hs:'short',hair:'#3a2417',eyes:'#3b2a1c',skin:'#f2c9a0',build:1,shirt:'#f4f4f4',bt:'long',pants:'#1c2a5e',shoes:'#ffffff'};}
function presetLook(i){const L=normLook(LOOK[AV[i].key]);return {g:L.g,hs:L.hs,hair:L.hair,eyes:L.eyes,skin:L.skin,build:1,shirt:L.shirt,bt:L.bt,pants:L.pants,shoes:'#ffffff'};}
function cycleRow(i,dir){const R=ROWS[i],L=setup.look;let k=R.vals.indexOf(L[R.key]);if(k<0)k=0;k=(k+dir+R.vals.length)%R.vals.length;L[R.key]=R.vals[k];setup.row=i;sfx.pick();}
function setRow(i,v){setup.look[ROWS[i].key]=v;setup.row=i;sfx.pick();}
function rotateLook(){setup.rot=(setup.rot+1)%4;sfx.pick();}
function randomLook(){
  const L=setup.look;
  for(const R of ROWS){const vals=(R.key==='bt'&&L.g==='m')?R.vals.slice(0,2):R.vals;L[R.key]=vals[Math.floor(Math.random()*vals.length)];}
  sfx.star();
}
function finishName(){
  if(scene!=='setup'||setup.step!==0)return;
  const v=inp.value.replace(/\s+/g,' ').trim().slice(0,12).replace(/^./,ch=>ch.toLocaleUpperCase('es'));
  if(!v){setup.shake=time+2;sfx.bad();try{inp.focus();}catch(e){}return;}
  save.name=v;inp.style.display='none';try{inp.blur();}catch(e){}
  setup.step=1;setup.sel=0;sfx.ok();speak(`Nice to meet you, ${v}! Are you a boy or a girl?`);
}
function pickGender(i){
  if(scene!=='setup'||setup.step!==1)return;
  setup.look=defaultLook(i===0?'m':'f');setup.step=2;setup.row=0;setup.rot=0;sfx.ok();speak('Make your character!');
}
function finishCustom(){
  if(scene!=='setup'||setup.step!==2)return;
  save.look=Object.assign({},setup.look);sfx.ok();
  if(setup.back){setup.back=false;scene='game';held.length=0;writeSave();return;}
  enterWorld();
}
function openWardrobe(){
  if(scene!=='game'||ui.mode!=='play'||ui.locked||player.moving||ui.fade>.3)return;
  setup.look=Object.assign({},save.look||presetLook(save.avatar||0));setup.step=2;setup.row=0;setup.rot=0;setup.back=true;held.length=0;scene='setup';sfx.pick();
}
function enterWorld(){
  if(!save.look)save.look=presetLook(save.avatar||0);
  if(save.rafa===2&&photoCount()<N_PHOTOS)save.rafa=1;
  scene='game';setMap(save.map);
  player.x=player.tx=save.x;player.y=player.ty=save.y;player.px=save.x*TS;player.py=save.y*TS;player.dir=save.dir||'up';player.moving=false;
  resetTrail();
  held.length=0;parts.length=0;ui.mode='play';ui.dlg=null;ui.choice=null;ui.locked=false;
  ui.fade=1;ui.fadeTarget=null;fadeTo(0);
  if(!save.intro)runScript(intro);
}
function toggleVoice(){state.voice=!state.voice;if(!state.voice&&'speechSynthesis' in window)speechSynthesis.cancel();savePrefs();}
function toggleMusic(){state.music=!state.music;savePrefs();}
function speakCurrent(){const d=ui.mode==='say'?ui.dlg:ui.mode==='choose'?ui.choice:null;if(d){if(!state.voice)state.voice=true;speak(d.en);}}
const settings={msg:'',ok:false};
const MAPLIST=[['patio','Patio'],['class','Sala'],['library','Biblioteca'],['cafe','Cafetería'],['hall','Auditorio'],['garden','Jardín'],['gym','Gimnasio'],['lab','Laboratorio'],['art','Arte'],['music','Música'],['plaza','Plaza'],['computer','Computación'],['teachers','Profesores'],['final','Patio final'],['books','Biblioteca sec.'],['boss','Sala de Seba']];
const ARR={patio:[9,12,'up'],garden:[2,7,'right'],plaza:[2,7,'right'],final:[2,7,'right']};
function openSettings(){
  if(scene!=='game'||ui.mode!=='play'||ui.locked||player.moving||ui.fade>.3)return;
  held.length=0;scene='settings';settings.msg=state.cheat?'🔓 Modo revisión ACTIVADO':'';settings.ok=true;
  codeEl.value='';codeEl.style.display='block';positionCode();sfx.pick();
}
function closeSettings(){
  if(scene!=='settings')return;
  scene='game';codeEl.style.display='none';try{codeEl.blur();}catch(e){}held.length=0;sfx.pick();
}
function applyCode(){
  if(scene!=='settings')return;
  const v=codeEl.value.trim();codeEl.value='';
  if(v==='000'){state.cheat=!state.cheat;settings.ok=true;settings.msg=state.cheat?'🔓 ¡Modo revisión ACTIVADO! Puedes entrar a cualquier lugar.':'🔒 Modo revisión desactivado.';sfx.star();}
  else if(!v){settings.ok=false;settings.msg='Escribe un código primero / Type a code first';sfx.bad();}
  else{settings.ok=false;settings.msg='Código incorrecto / Wrong code';sfx.bad();}
  try{codeEl.focus();}catch(e){}
}
function cheatGo(id){
  if(!state.cheat||scene!=='settings')return;
  closeSettings();
  const a=ARR[id]||[9,13,'up'];
  runScript(async()=>{await goMap(id,a[0],a[1],a[2]);});
}
function openWardrobeFromSettings(){closeSettings();openWardrobe();}

  hits=[];

  c.textBaseline='middle';c.textAlign='left';c.font=F(21,'bold');c.fillStyle=GOLD;c.fillText('⚙️ Configuración / Settings',44,34);
  const btn=(x,y,w,h,label,style,fn,sz=14)=>{

  sec(200,'ROPA / CLOTHES');

  if(state.cheat){
    sec(334,'IR A / GO TO  (modo revisión)');
    MAPLIST.forEach((m,i)=>{const bw=103,bh=24,x=44+(i%5)*(bw+6.5),y=346+Math.floor(i/5)*(bh+4);btn(x,y,bw,bh,m[1],cur&&cur.id===m[0]?'gold':null,()=>cheatGo(m[0]),12);});

function confirmAction(){
  if(scene==='book'){bookTurn(1,true);return;}
  if(scene==='settings')return;
  if(scene==='title'){startGame(hasSave&&titleSel===1);return;}
  if(scene==='setup'){if(setup.step===0)finishName();else if(setup.step===1)pickGender(setup.sel);else finishCustom();return;}
  if(scene==='end'){
    if(endT<1.8)return;
    if(certResolve){const r=certResolve;certResolve=null;(async()=>{await fadeTo(1);scene='game';parts.length=0;held.length=0;await fadeTo(0);r();})();return;}
    scene='title';hasSave=!!loadSave();titleSel=0;parts.length=0;held.length=0;return;
  }
  if(ui.mode==='say'&&ui.dlg){const d=ui.dlg;if(d.t<d.len){d.t=d.len;}else{ui.dlg=null;d.resolve();}return;}
  if(ui.mode==='choose'&&ui.choice){const ch=ui.choice;if(ch.t<ch.len){ch.t=ch.len;return;}if(ch.disabled.has(ch.sel))return;const r=ch.resolve;r&&r(ch.sel);return;}
  if(ui.mode==='play'&&!ui.locked&&!player.moving&&ui.fade<.3)interact();
}
function nav(dir){
  if(scene==='book'){if(dir==='left')bookTurn(-1);else if(dir==='right')bookTurn(1);return;}
  if(scene==='settings'){if(dir==='left')volStep(-.1);else if(dir==='right')volStep(.1);return;}
  if(scene==='setup'){
    if(setup.step===1){setup.sel=1-setup.sel;sfx.pick();}
    else if(setup.step===2){
      if(dir==='up'||dir==='down'){setup.row=(setup.row+(dir==='down'?1:ROWS.length-1))%ROWS.length;sfx.pick();}
      else cycleRow(setup.row,dir==='right'?1:-1);
    }
    return;
  }
  if(scene==='title'){const n=hasSave?2:1;if(dir==='up'||dir==='down'){titleSel=(titleSel+(dir==='down'?1:-1)+n)%n;sfx.pick();}return;}
  if(ui.mode==='choose'&&ui.choice){
    const ch=ui.choice,n=ch.opts.length;let s=ch.sel;
    for(let k=0;k<n;k++){s=(s+((dir==='down'||dir==='right')?1:-1)+n)%n;if(!ch.disabled.has(s))break;}
    if(s!==ch.sel){ch.sel=s;sfx.pick();}
  }
}

/* ---------- entrada ---------- */
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
const CONF=[' ','Enter','z','Z','e','E'];
addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='cd'){if(e.key==='Enter'){e.preventDefault();applyCode();}else if(e.key==='Escape'){e.preventDefault();closeSettings();}return;}
  if(e.target&&e.target.id==='nm'){if(e.key==='Enter'){e.preventDefault();finishName();}return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(KEYMAP[k]||CONF.includes(k))e.preventDefault();
  initAudio();
  const dir=KEYMAP[k];
  if(dir){if(!held.includes(dir))held.push(dir);if(!e.repeat)nav(dir);}
  else if(CONF.includes(k)){if(!e.repeat)confirmAction();}
  else if(k==='l'||k==='L')speakCurrent();
  else if(k==='m'||k==='M')toggleMusic();
  else if(k==='v'||k==='V')toggleVoice();
  else if(scene==='setup'&&setup.step===1&&'12'.includes(k)&&k.length===1)pickGender(+k-1);
  else if(scene==='setup'&&setup.step===2&&(k==='r'||k==='R'))rotateLook();
  else if(scene==='setup'&&setup.step===2&&(k==='g'||k==='G'))randomLook();
  else if(scene==='game'&&(k==='c'||k==='C'))openWardrobe();
  else if(scene==='book'&&(k==='Escape'||k==='o'||k==='O'))closeBook();
  else if((k==='Escape'||k==='o'||k==='O')&&scene==='game')openSettings();
  else if((k==='Escape'||k==='o'||k==='O')&&scene==='settings')closeSettings();
  else if(ui.mode==='choose'&&ui.choice&&'123'.includes(k)&&k.length===1){
    const i=+k-1,ch=ui.choice;if(i<ch.opts.length&&!ch.disabled.has(i)){ch.sel=i;if(ch.t<ch.len)ch.t=ch.len;const r=ch.resolve;r&&r(i);}
  }
});
addEventListener('keyup',e=>{const d=KEYMAP[e.key];if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);}});
addEventListener('blur',()=>{held.length=0;});
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height};}
cv.addEventListener('pointerdown',e=>{
  initAudio();const p=toCanvas(e);
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();return;}}
  if(scene==='end'||(scene==='game'&&ui.mode==='say'))confirmAction();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;const p=toCanvas(e);
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(h.hover&&p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.hover();return;}}
});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* controles táctiles */
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
document.querySelectorAll('[data-dir]').forEach(b=>{
  const d=b.dataset.dir;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.classList.add('on');if(!held.includes(d))held.push(d);nav(d);});
  const up=()=>{b.classList.remove('on');const i=held.indexOf(d);if(i>=0)held.splice(i,1);};
  b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
});
document.getElementById('bA').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();confirmAction();});
document.getElementById('bL').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();speakCurrent();});

/* tamaño de pantalla */
function resize(){
  const touch=document.body.classList.contains('touch');
  const availH=innerHeight-(touch?190:20),availW=innerWidth-20;
  const w=Math.max(240,Math.min(availW,availH*CW/CH));
  cv.style.width=w+'px';cv.style.height=(w*CH/CW)+'px';
  positionInput();positionCode();
}
addEventListener('resize',resize);resize();
if('speechSynthesis' in window)speechSynthesis.getVoices();

setMap('patio');
requestAnimationFrame(frame);
})();
